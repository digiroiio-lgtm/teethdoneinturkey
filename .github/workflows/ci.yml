name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate sitemap freshness manifest for audit
        run: |
          npm run seo:lastmod
          echo '---ROUTE_LASTMOD_BEGIN---'
          cat seo/route-lastmod.json
          echo '---ROUTE_LASTMOD_END---'

      - name: Verify sitemap freshness manifest
        run: npm run seo:lastmod:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
